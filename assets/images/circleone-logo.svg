<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 114" fill="none" class="circleone-brand-logo">
  <defs>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ff6b00" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A67D2" />
      <stop offset="100%" stop-color="#004AAD" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8533" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
  </defs>

  <!-- Emblem Mark at (60, 57) -->
  <g transform="translate(60, 57)">
    <!-- 3 Concentric Royal Blue Arcs (270 deg from -45 to +225 deg) -->
    <!-- Outer Arc: R=48, stroke=10 -->
    <path d="M 33.94 -33.94 A 48 48 0 1 0 33.94 33.94" 
          fill="none" stroke="url(#blue-grad)" stroke-width="10" stroke-linecap="butt" />
    
    <!-- Middle Arc: R=34, stroke=9 -->
    <path d="M 24.04 -24.04 A 34 34 0 1 0 24.04 24.04" 
          fill="none" stroke="url(#blue-grad)" stroke-width="9" stroke-linecap="butt" />
    
    <!-- Inner Arc: R=21, stroke=8 -->
    <path d="M 14.85 -14.85 A 21 21 0 1 0 14.85 14.85" 
          fill="none" stroke="url(#blue-grad)" stroke-width="8" stroke-linecap="butt" />

    <!-- Solid Vibrant Orange Wedge between -45 deg and +45 deg -->
    <path d="M 11.31 -11.31 
             L 38.18 -38.18 
             A 54 54 0 0 1 38.18 38.18 
             L 11.31 11.31 
             A 16 16 0 0 0 11.31 -11.31 Z" 
          fill="url(#orange-grad)" filter="url(#glow-orange)" />
  </g>

  <!-- Bold CIRCLE in official Royal Blue #004AAD -->
  <text x="124" y="66" 
        textLength="184" 
        lengthAdjust="spacingAndGlyphs"
        font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-weight="900" 
        font-size="54" 
        fill="url(#blue-grad)">CIRCLE</text>

  <!-- ONE badge snugly positioned at x=314 (only 6px gap from CIRCLE!) -->
  <g transform="translate(314, 25)">
    <rect x="0" y="0" width="68" height="43" rx="10" fill="url(#orange-grad)" filter="url(#glow-orange)"/>
    <text x="34" y="31" 
          text-anchor="middle" 
          font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
          font-weight="900" 
          font-size="24" 
          letter-spacing="0.5px" 
          fill="#ffffff">ONE</text>
  </g>

  <!-- Subtitle: High-Contrast, Bold, Crystal-Clear "B2B CORPORATE MERCHANDISING" -->
  <text x="125" y="93" 
        textLength="257" 
        lengthAdjust="spacingAndGlyphs"
        font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif" 
        font-weight="800" 
        font-size="15.5" 
        letter-spacing="1.8px" 
        fill="#004AAD">B2B CORPORATE MERCHANDISING</text>
</svg>
